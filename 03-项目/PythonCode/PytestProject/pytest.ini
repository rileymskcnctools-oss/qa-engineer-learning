[pytest]
# ============================================================
# Pytest 配置文件
# 另一台电脑 git clone 后，装好依赖直接 `pytest` 即可运行
# ============================================================

# 测试文件搜索路径
testpaths = tests

# 文件/类/函数命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ============================================================
# 自定义 marker 注册（必须在 pytest.ini 中注册，否则 Warning）
# ============================================================
markers =
    smoke: 冒烟测试 — 核心功能快速验证
    slow: 慢速测试 — 大数据量/性能场景，CI 中可选择跳过
    regression: 回归测试 — 全量验证
    int: 整数测试
    str: 字符串测试
    float: 浮点测试
    minus: 负数测试
    zero: 零值测试
    bignum: 大数测试

# ============================================================
# 默认参数
# ============================================================
addopts = -v --tb=short --strict-markers
